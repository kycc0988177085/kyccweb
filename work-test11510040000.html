<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡管理系統 Pro - Attendance Management System</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-200">

    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header Nav -->
        <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700 px-4 sm:px-6 py-3 transition-colors">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md shadow-blue-500/20">
                        <i data-lucide="clock" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-lg sm:text-xl tracking-tight leading-none bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent dark:from-blue-400 dark:to-indigo-400">
                            打卡管理系統 Pro
                        </h1>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-medium hidden sm:inline">企業級差勤與差假管理平台</span>
                    </div>
                </div>

                <!-- User Bar & Utilities -->
                <div class="flex items-center space-x-3">
                    <!-- Theme Switcher -->
                    <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition">
                        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    </button>

                    <!-- Role Switcher / User Info -->
                    <div id="userInfoContainer" class="hidden flex items-center space-x-3 border-l border-slate-200 dark:border-slate-700 pl-3">
                        <div class="text-right hidden sm:block">
                            <div id="userDisplayName" class="text-sm font-bold text-slate-800 dark:text-slate-100 leading-snug">--</div>
                            <div id="userDisplayRole" class="text-xs text-slate-500 dark:text-slate-400">--</div>
                        </div>
                        <button onclick="logout()" class="p-2 rounded-xl text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition flex items-center gap-1 text-sm font-semibold" title="登出">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                            <span class="hidden md:inline">登出</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <nav id="navBar" class="hidden bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 sm:px-6 sticky top-[61px] z-20 shadow-sm">
            <div class="max-w-7xl mx-auto flex space-x-1 sm:space-x-4 overflow-x-auto custom-scrollbar py-2" id="navTabsContainer">
                <!-- Nav items dynamically rendered here -->
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div id="mainContent">
                <!-- Dynamic Content injected here -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-slate-200 dark:border-slate-800 py-4 px-6 text-center text-xs text-slate-500 dark:text-slate-400">
            © 2026 企業打卡管理系統 Pro · 版權所有 · MVP 系統範例
        </footer>
    </div>

    <input id="excelScheduleFileInput" type="file" accept=".xlsx,.xls,.csv" class="hidden" onchange="importExcelSchedule(this)">

    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-200 flex items-center justify-center p-4">
        <div id="modalContainer" class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 w-full max-w-lg transform scale-95 transition-transform duration-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white">視窗標題</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 max-h-[75vh] overflow-y-auto custom-scrollbar">
                <!-- Modal Dynamic Content -->
            </div>
            <div id="modalFooter" class="px-6 py-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                <!-- Dynamic Buttons -->
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // State Management
        const DEFAULT_EMPLOYEES = [
            { id: 1, code: "E001", username: "wang", password: "123", name: "王小明", dept: "業務部", job: "業務資深專員", workStart: "09:00", workEnd: "18:00", overtimeHours: 2, dailyWorkHoursLimit: 8, in: "08:56", out: "18:02", status: "正常", active: true, lat: 25.0339, lng: 121.5645 },
            { id: 2, code: "E002", username: "chen", password: "123", name: "陳小華", dept: "工程部", job: "全棧工程師", workStart: "09:00", workEnd: "18:00", overtimeHours: 2, dailyWorkHoursLimit: 8, in: "09:18", out: "", status: "遲到", active: true, lat: 25.0345, lng: 121.5650 },
            { id: 3, code: "E003", username: "lin", password: "123", name: "林小美", dept: "行政部", job: "行政資深經理", workStart: "08:30", workEnd: "17:30", overtimeHours: 3, dailyWorkHoursLimit: 8, in: "08:51", out: "19:30", status: "加班", active: true, lat: 25.0338, lng: 121.5642 },
            { id: 4, code: "E004", username: "chang", password: "123", name: "張志豪", dept: "工程部", job: "UI/UX 設計師", workStart: "09:00", workEnd: "18:00", overtimeHours: 2, dailyWorkHoursLimit: 8, in: "", out: "", status: "未打卡", active: true, lat: null, lng: null },
            { id: 5, code: "E005", username: "huang", password: "123", name: "黃大衛", dept: "產品部", job: "產品總監", workStart: "09:00", workEnd: "18:00", overtimeHours: 2, dailyWorkHoursLimit: 8, in: "09:00", out: "18:15", status: "正常", active: true, lat: 25.0336, lng: 121.5640 }
        ];

        const MANAGER_ACCOUNT = { username: "admin", password: "123", name: "系統主管 (Admin)", role: "manager" };

        // 主管帳號密碼：首次使用預設 123，之後由主管自行修改並儲存在本機瀏覽器
        try {
            const savedManagerAccount = JSON.parse(localStorage.getItem("sys_manager_account"));
            if (savedManagerAccount && typeof savedManagerAccount.password === "string" && savedManagerAccount.password.length > 0) {
                MANAGER_ACCOUNT.password = savedManagerAccount.password;
            }
        } catch (e) {}

        function getManagerPassword() {
            return MANAGER_ACCOUNT.password;
        }

        function saveManagerAccount() {
            localStorage.setItem("sys_manager_account", JSON.stringify({
                username: MANAGER_ACCOUNT.username,
                password: MANAGER_ACCOUNT.password,
                name: MANAGER_ACCOUNT.name,
                role: MANAGER_ACCOUNT.role
            }));
        }

        // Default Office Coordinates (e.g. Taipei 101 area)
        const OFFICE_GEO = { lat: 25.033976, lng: 121.564538, allowedRadiusMeters: 500 };

        // 依職稱自動設定每日上班時數上限：隨扈 11 小時、安駕 10 小時、安管 12 小時，其餘 8 小時。
        function getDailyWorkHoursLimitByJob(job) {
            const title = String(job || '').trim();
            if (title.includes('隨扈')) return 11;
            if (title.includes('安駕')) return 10;
            if (title.includes('安管')) return 12;
            return 8;
        }

        function applyDailyWorkHoursLimitByJob(emp) {
            if (!emp) return 8;
            const limit = getDailyWorkHoursLimitByJob(emp.job);
            emp.dailyWorkHoursLimit = limit;
            return limit;
        }

        // 相容舊版資料：若既有員工尚未設定班表，使用 09:00-18:00
        function ensureMonthlySchedule(emp) {
            if (!emp.monthlySchedule || typeof emp.monthlySchedule !== 'object') emp.monthlySchedule = {};
            return emp.monthlySchedule;
        }

        function getScheduleKey(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDailyWorkHoursLimit(emp) {
            return getDailyWorkHoursLimitByJob(emp?.job);
        }

        function getEmployeeSchedule(emp, date = new Date()) {
            ensureMonthlySchedule(emp);
            const item = emp.monthlySchedule[getScheduleKey(date)];
            return {
                workStart: item?.workStart || emp.workStart || '09:00',
                workEnd: item?.workEnd || emp.workEnd || '18:00',
                overtimeHours: Number.isFinite(Number(item?.overtimeHours))
                    ? Number(item.overtimeHours)
                    : (Number.isFinite(Number(emp.overtimeHours)) ? Number(emp.overtimeHours) : 2)
            };
        }

        // 班表代碼對應規則：Excel 匯入時會自動套用上下班時間。
        // X / 特 / 補 / 原 / 折 / 事 / 烏 / 台中 / 夫人 / S / 值班文字等無明確固定時段者，保留代碼並沿用員工預設時間；
        // X、各類假別則視為非固定工時，時間欄位使用 00:00-00:00，避免誤算正常出勤工時。
        const SHIFT_CODE_MAP = {
            'A':   { start: '09:00', end: '17:00', label: '09:00-17:00' },
            'B':   { start: '17:00', end: '01:00', label: '17:00-01:00' },
            'C':   { start: '07:00', end: '15:00', label: '07:00-15:00' },
            'D':   { start: '15:00', end: '23:00', label: '15:00-23:00' },
            'E':   { start: '12:00', end: '23:00', label: '12:00-23:00' },
            'F':   { start: '11:00', end: '19:00', label: '11:00-19:00' },
            'X':   { start: '00:00', end: '00:00', label: '休假', leave: true },
            '▲':   { start: '09:00', end: '19:00', label: '09:00-19:00' },
            '早1':  { start: '06:30', end: '18:30', label: '06:30-18:30' },
            '早2':  { start: '07:00', end: '19:00', label: '07:00-19:00' },
            '早3':  { start: '10:00', end: '22:00', label: '10:00-22:00' },
            '晚':   { start: '18:30', end: '06:30', label: '18:30-06:30' },
            '支':   { start: '11:00', end: '19:00', label: '11:00-19:00' },
            '值':   { start: '11:00', end: '19:00', label: '11:00-19:00（值班隨扈）' },
            'AB':   { start: '09:00', end: '01:00', label: '09:00-01:00' },
            'S':   { start: null, end: null, label: '機動備勤' },
            '特':   { start: '00:00', end: '00:00', label: '特休', leave: true },
            '補':   { start: '00:00', end: '00:00', label: '補休', leave: true },
            '原':   { start: '00:00', end: '00:00', label: '原民假', leave: true },
            '折':   { start: '00:00', end: '00:00', label: '折抵時數' },
            '事':   { start: '00:00', end: '00:00', label: '事假', leave: true },
            '烏':   { start: null, end: null, label: '至農場' },
            '台中': { start: null, end: null, label: '待命至台中' },
            '夫人': { start: null, end: null, label: '未至台中載夫人' }
        };

        function getShiftCodeDefinition(code) {
            const key = String(code ?? '').trim();
            return SHIFT_CODE_MAP[key] || null;
        }

        function applyShiftCodeToSchedule(emp, dateKey, shiftCode, old = {}) {
            const code = String(shiftCode ?? '').trim();
            const rule = getShiftCodeDefinition(code);
            const fallbackStart = old.workStart || emp.workStart || '09:00';
            const fallbackEnd = old.workEnd || emp.workEnd || '18:00';
            return {
                workStart: rule?.start ?? fallbackStart,
                workEnd: rule?.end ?? fallbackEnd,
                overtimeHours: Number.isFinite(Number(old.overtimeHours)) ? Number(old.overtimeHours) : Number(emp.overtimeHours ?? 2),
                shiftCode: code
            };
        }

        const storedEmployees = JSON.parse(localStorage.getItem('sys_employees')) || DEFAULT_EMPLOYEES;
        storedEmployees.forEach(e => {
            e.workStart = e.workStart || '09:00';
            e.workEnd = e.workEnd || '18:00';
            e.overtimeHours = Number.isFinite(Number(e.overtimeHours)) ? Number(e.overtimeHours) : 2;
            e.dailyWorkHoursLimit = getDailyWorkHoursLimitByJob(e.job);
            e.dailyWorkHoursLimit = Number.isFinite(Number(e.dailyWorkHoursLimit)) ? Number(e.dailyWorkHoursLimit) : 8;
            ensureMonthlySchedule(e);
        });

        let state = {
            employees: storedEmployees,
            currentUser: JSON.parse(localStorage.getItem('sys_user')) || null,
            isManager: localStorage.getItem('sys_isManager') === 'true',
            currentPage: localStorage.getItem('sys_page') || 'home',
            attendanceRecords: JSON.parse(localStorage.getItem('sys_attendance')) || generateMockAttendanceHistory(),
            requests: JSON.parse(localStorage.getItem('sys_requests')) || generateMockRequests(),
            gpsLocation: null,
            gpsError: null
        };

        function saveState() {
            localStorage.setItem('sys_employees', JSON.stringify(state.employees));
            localStorage.setItem('sys_user', JSON.stringify(state.currentUser));
            localStorage.setItem('sys_isManager', state.isManager);
            localStorage.setItem('sys_page', state.currentPage);
            localStorage.setItem('sys_attendance', JSON.stringify(state.attendanceRecords));
            localStorage.setItem('sys_requests', JSON.stringify(state.requests));
        }

        // Generate Mock History Records for demonstration
        function generateMockAttendanceHistory() {
            const list = [];
            const dates = ["2026-10-01", "2026-09-30", "2026-09-29", "2026-09-28", "2026-09-25", "2026-09-24", "2026-09-23"];
            const statuses = ["正常", "正常", "遲到", "加班", "正常", "正常", "請假"];
            
            DEFAULT_EMPLOYEES.forEach(emp => {
                dates.forEach((d, idx) => {
                    list.push({
                        id: Math.random().toString(36).substring(2, 9),
                        employeeId: emp.id,
                        employeeName: emp.name,
                        dept: emp.dept,
                        date: d,
                        inTime: statuses[idx] === '請假' ? '--' : (idx === 2 ? '09:22' : '08:52'),
                        outTime: statuses[idx] === '請假' ? '--' : (statuses[idx] === '加班' ? '20:15' : '18:05'),
                        status: statuses[idx],
                        location: '台北總部辦公室 (GPS: 25.034, 121.564)'
                    });
                });
            });
            return list;
        }

        function generateMockRequests() {
            return [
                { id: "R001", empId: 2, name: "陳小華", type: "補打卡", date: "2026-09-29", time: "18:00", reason: "系統異常未成功送出", status: "待審核", timestamp: "2026-09-30 09:10" },
                { id: "R002", empId: 3, name: "林小美", type: "事假", date: "2026-10-05", duration: "1 天", reason: "處理家庭私人事務", status: "待審核", timestamp: "2026-10-01 14:20" },
                { id: "R003", empId: 1, name: "王小明", type: "特休", date: "2026-10-10", duration: "1 天", reason: "個人休假規劃", status: "已核准", timestamp: "2026-09-25 10:00" }
            ];
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderHeader();
            renderApp();
            startClock();
            simulateGPS();
        });

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('sys_theme', isDark ? 'dark' : 'light');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('sys_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function setPage(page) {
            state.currentPage = page;
            saveState();
            renderHeader();
            renderApp();
        }

        function logout() {
            state.currentUser = null;
            state.isManager = false;
            state.currentPage = 'login';
            saveState();
            renderHeader();
            renderApp();
            toast("已成功登出系統", "info");
        }

        function toast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toastEl = document.createElement('div');
            
            const colorClasses = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-blue-600 text-white',
                warning: 'bg-amber-500 text-white'
            };

            const icons = {
                success: 'check-circle',
                error: 'alert-circle',
                info: 'info',
                warning: 'alert-triangle'
            };

            toastEl.className = `${colorClasses[type] || colorClasses.info} px-4 py-3 rounded-xl shadow-lg font-medium text-sm flex items-center space-x-2 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto max-w-md`;
            toastEl.innerHTML = `
                <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 flex-shrink-0"></i>
                <span>${message}</span>
            `;

            container.appendChild(toastEl);
            lucide.createIcons();

            setTimeout(() => {
                toastEl.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toastEl.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toastEl.remove(), 300);
            }, 3500);
        }

        function renderHeader() {
            const userInfoContainer = document.getElementById('userInfoContainer');
            const navBar = document.getElementById('navBar');
            const navTabsContainer = document.getElementById('navTabsContainer');

            if (!state.currentUser) {
                userInfoContainer.classList.add('hidden');
                navBar.classList.add('hidden');
                return;
            }

            userInfoContainer.classList.remove('hidden');
            navBar.classList.remove('hidden');

            document.getElementById('userDisplayName').textContent = state.currentUser.name;
            document.getElementById('userDisplayRole').textContent = state.isManager ? '主管 / 管理員' : `${state.currentUser.dept} · ${state.currentUser.job}`;

            const managerTabs = [
                { id: 'dashboard', label: '今日出勤總覽', icon: 'layout-dashboard' },
                { id: 'employees', label: '員工管理', icon: 'users' },
                { id: 'records', label: '出勤數據報表', icon: 'file-text' },
                { id: 'requests', label: '審核簽核區', icon: 'check-square' }
            ];

            const employeeTabs = [
                { id: 'home', label: '打卡打卡', icon: 'clock' },
                { id: 'myrecords', label: '個人差勤月曆', icon: 'calendar' },
                { id: 'myrequests', label: '請假／補打卡申請', icon: 'send' }
            ];

            const tabs = state.isManager ? managerTabs : employeeTabs;

            navTabsContainer.innerHTML = tabs.map(tab => {
                const isActive = state.currentPage === tab.id;
                return `
                    <button onclick="setPage('${tab.id}')" class="flex items-center space-x-2 px-4 py-2 rounded-xl font-semibold text-sm transition whitespace-nowrap ${
                        isActive 
                        ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/30' 
                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60'
                    }">
                        <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                        <span>${tab.label}</span>
                    </button>
                `;
            }).join('');

            if (state.isManager) {
                navTabsContainer.innerHTML += `
                    <button onclick="openManagerPasswordModal()" class="flex items-center space-x-2 px-4 py-2 rounded-xl font-semibold text-sm transition whitespace-nowrap text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60">
                        <i data-lucide="key-round" class="w-4 h-4"></i>
                        <span>修改主管密碼</span>
                    </button>
                `;
            }

            lucide.createIcons();
        }

        function startClock() {
            setInterval(() => {
                const now = new Date();
                const clockEl = document.getElementById('digitalClock');
                const dateEl = document.getElementById('digitalDate');
                if (clockEl) {
                    clockEl.textContent = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                if (dateEl) {

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        state.gpsLocation = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            address: "目前 GPS 定位成功（台北市辦公區域附近）",
                            dist: calculateDistance(pos.coords.latitude, pos.coords.longitude, OFFICE_GEO.lat, OFFICE_GEO.lng)
                        };
                        updateGpsUI();
                    },
                    (err) => {
                        // Fallback mock location if denied or not available
                        state.gpsLocation = {
                            lat: 25.0339,
                            lng: 121.5645,
                            address: "信義區松智路 1 號 (模擬公司 GPS)",

                updateGpsUI();
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // meters
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                    Math.cos(φ1) * Math.cos(φ2) *
                    Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return Math.round(R * c);
        }

        function handlePunch(type) {
            if (!state.gpsLocation) {
                toast("尚未取得 GPS 位置，請稍候再試", "warning");
                return;
            }

            if (state.gpsLocation.dist > OFFICE_GEO.allowedRadiusMeters) {
                toast(`您超出允許打卡範圍 (${OFFICE_GEO.allowedRadiusMeters}m)，目前距離 ${state.gpsLocation.dist}m`, "error");
                return;
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
            const emp = state.employees.find(x => x.id === state.currentUser.id);

            if (type === 'in') {
                emp.in = timeStr;
                // 依該員工個人設定的上班時間判定是否遲到
                const schedule = getEmployeeSchedule(emp, now);
                const start = schedule.workStart;
                const startMinutes = Number(start.split(':')[0]) * 60 + Number(start.split(':')[1]);
                const nowMinutes = now.getHours() * 60 + now.getMinutes();
                const isLate = nowMinutes > startMinutes;
                emp.status = isLate ? '遲到' : '正常';
                toast(`上班打卡成功！時間：${timeStr}（班表 ${start}，${emp.status}）`, isLate ? "warning" : "success");
            } else {
                emp.out = timeStr;
                // 依該員工個人設定的下班時間判定加班
                const schedule = getEmployeeSchedule(emp, now);
                const end = schedule.workEnd;
                const endMinutes = Number(end.split(':')[0]) * 60 + Number(end.split(':')[1]);
                const nowMinutes = now.getHours() * 60 + now.getMinutes();
                const overtimeLimit = schedule.overtimeHours;
                const rawOvertimeMinutes = Math.max(0, nowMinutes - endMinutes);
                const overtimeMinutes = Math.min(rawOvertimeMinutes, overtimeLimit * 60);
                const dailyLimitMinutes = Math.round((Number(emp.dailyWorkHoursLimit) || 8) * 60);
                let actualWorkedMinutes = Math.max(0, nowMinutes - (emp.in ? Number(emp.in.split(':')[0]) * 60 + Number(emp.in.split(':')[1]) : nowMinutes));
                actualWorkedMinutes = Math.min(actualWorkedMinutes, dailyLimitMinutes);
                emp.workedHoursToday = Number((actualWorkedMinutes / 60).toFixed(2));
                emp.overtimeHoursToday = Number((overtimeMinutes / 60).toFixed(2));
                if (rawOvertimeMinutes > 0) {
                    emp.status = '加班';
                }
                toast(`下班打卡成功！時間：${timeStr}（班表 ${end}，今日加班 ${emp.overtimeHoursToday} 小時）`, "success");
            }

            saveState();
            renderApp();
        }

        function openMonthlyScheduleModal(empId, selectedMonth = null) {
            const emp = state.employees.find(x => x.id === empId);
            if (!emp) return;

            ensureMonthlySchedule(emp);
            const now = new Date();
            const monthValue = selectedMonth || `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const [year, month] = monthValue.split('-').map(Number);
            const daysInMonth = new Date(year, month, 0).getDate();

            const rows = Array.from({ length: daysInMonth }, (_, i) => {
                const day = i + 1;
                const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dateObj = new Date(year, month - 1, day);
                const weekday = dateObj.toLocaleDateString('zh-TW', { weekday: 'short' });
                const saved = emp.monthlySchedule[dateKey] || {};
                const schedule = {
                    workStart: saved.workStart || emp.workStart || '09:00',
                    workEnd: saved.workEnd || emp.workEnd || '18:00',
                    overtimeHours: Number.isFinite(Number(saved.overtimeHours))
                        ? Number(saved.overtimeHours)

        function saveMonthlySchedule(empId, monthValue, daysInMonth) {
            const emp = state.employees.find(x => x.id === empId);
            if (!emp) return;
            ensureMonthlySchedule(emp);

            for (let day = 1; day <= daysInMonth; day++) {

                    toast(`第 ${day} 日班表資料不完整或加班上限無效`, "warning");
                    return;
                }
                const dateKey = `${monthValue}-${String(day).padStart(2, '0')}`;

            closeModal();

        function normalizeExcelTime(value, fallback) {
            if (value instanceof Date) {
                const hh = String(value.getHours()).padStart(2, '0');
                const mm = String(value.getMinutes()).padStart(2, '0');
                return `${hh}:${mm}`;
            }
            if (typeof value === 'number' && value >= 0 && value < 1) {
                const total = Math.round(value * 24 * 60);
                return `${String(Math.floor(total / 60) % 24).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
            }
            const str = String(value ?? '').trim();
            const m = str.match(/^(\d{1,2})[:：](\d{1,2})$/);
            if (m) return `${String(Number(m[1])).padStart(2, '0')}:${String(Number(m[2])).padStart(2, '0')}`;
            return fallback;
        }

        function importExcelSchedule(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (typeof XLSX === 'undefined') {
                toast('Excel 元件尚未載入，請重新整理頁面後再試', 'error');
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const workbook = XLSX.read(e.target.result, { type: 'array', cellDates: true });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    if (!rows.length) throw new Error('Excel 沒有資料');

                    const headerRowIndex = rows.findIndex(r => r.slice(0, 6).some(v => String(v).trim() === '姓名'));
                    if (headerRowIndex < 0) throw new Error('找不到「姓名」欄位');
                    const header = rows[headerRowIndex];
                    const nameCol = header.findIndex(v => String(v).trim() === '姓名');
                    const dayCols = {};
                    header.forEach((v, idx) => {
                        const n = Number(v);
                        if (Number.isInteger(n) && n >= 1 && n <= 31) dayCols[n] = idx;
                    });
                    if (Object.keys(dayCols).length < 5) throw new Error('找不到日期欄位（1～31）');

                    let title = String(rows[1]?.[0] || rows[0]?.[0] || file.name).trim();
                    const ym = title.match(/(\d{2,4})年(\d{1,2})月/);
                    let year = new Date().getFullYear();
                    let month = new Date().getMonth() + 1;
                    if (ym) {
                        year = Number(ym[1]);
                        if (year < 1911) year += 1911;
                        month = Number(ym[2]);
                    }
                    const monthValue = `${year}-${String(month).padStart(2, '0')}`;
                    const daysInMonth = new Date(year, month, 0).getDate();
                    let imported = 0, created = 0, updated = 0, skipped = 0;

                    for (let r = headerRowIndex + 1; r < rows.length; r++) {
                        const row = rows[r] || [];
                        const name = String(row[nameCol] ?? '').trim();
                        if (!name || name === '每日上勤人數' || name === '備註') continue;
                        const codeValues = dayCols;
                        const hasShift = Object.values(codeValues).some(c => String(row[c] ?? '').trim() !== '');
                        if (!hasShift) continue;

                        let emp = state.employees.find(x => x.name === name);
                        if (!emp) {
                            const vehicle = String(row[0] ?? '').trim();
                            const job = String(row[1] ?? '').trim() || '員工';
                            const id = Date.now() + created;
                            emp = {
                                id, code: `E${String(state.employees.length + 1).padStart(3, '0')}`,
                                username: `emp${String(state.employees.length + 1).padStart(3, '0')}`,
                                password: '123', name, dept: vehicle || '未分類', job,
                                workStart: '09:00', workEnd: '18:00', overtimeHours: 2, dailyWorkHoursLimit: getDailyWorkHoursLimitByJob(job),
                                in: '', out: '', status: '未打卡', active: true, lat: null, lng: null,
                                monthlySchedule: {}
                            };
                            state.employees.push(emp);
                            created++;
                        } else {
                            updated++;
                        }
                        ensureMonthlySchedule(emp);
                        for (let day = 1; day <= daysInMonth; day++) {
                            const col = dayCols[day];
                            if (col === undefined) continue;
                            const shiftCode = String(row[col] ?? '').trim();
                            if (!shiftCode) continue;
                            const dateKey = `${monthValue}-${String(day).padStart(2, '0')}`;
                            const old = emp.monthlySchedule[dateKey] || {};
                            emp.monthlySchedule[dateKey] = applyShiftCodeToSchedule(emp, dateKey, shiftCode, old);
                            imported++;
                        }
                    }
                    saveState();
                    renderApp();
                    toast(`Excel 班表匯入完成：${monthValue}，${imported} 筆班別；新增 ${created} 人、更新 ${updated} 人`, 'success');
                    setTimeout(() => openImportedScheduleSummary(monthValue, imported, created, updated), 150);
                } catch (err) {
                    console.error(err);
                    toast(`Excel 匯入失敗：${err.message || '格式無法辨識'}`, 'error');
                } finally {
                    input.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

            showModal('Excel 班表匯入結果', `
                <div class="space-y-4 text-sm">

        function saveEmployee(empId) {
            const code = document.getElementById('fCode').value.trim();
            const name = document.getElementById('fName').value.trim();

            const password = document.getElementById('fPass').value;

            const dailyWorkHoursLimit = getDailyWorkHoursLimitByJob(document.getElementById('fJob').value);
            const overtimeHours = Number(document.getElementById('fOvertimeHours').value);

            if (!code || !name || !username || !password || !job || !workStart || !workEnd || !Number.isFinite(dailyWorkHoursLimit) || dailyWorkHoursLimit <= 0 || dailyWorkHoursLimit > 24 || !Number.isFinite(overtimeHours) || overtimeHours < 0 || overtimeHours > 24) {
                toast("請完整填寫所有欄位資訊", "warning");
                return;
            }

            if (empId) {
                const target = state.employees.find(x => x.id === empId);
                Object.assign(target, { code, name, username, password, dept, job, workStart, workEnd, dailyWorkHoursLimit, overtimeHours });
                toast("員工資料更新成功！", "success");
            } else {
                const newEmp = {

            saveState();
            closeModal();
            renderApp();
        }

                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportCSV(filename, rows) {
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "日期,姓名,部門,上班,下班,狀態\n";
            rows.forEach(r => {
                csvContent += `${r.date},${r.employeeName},${r.dept},${r.inTime},${r.outTime},${r.status}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            toast("已開始下載 CSV 差勤報表", "success");
        }

        function parseTimeToMinutes(time) {
            if (!time || time === '--' || typeof time !== 'string' || !/^\d{1,2}:\d{2}$/.test(time)) return null;
            const [h, m] = time.split(':').map(Number);
            return h * 60 + m;
        }

        function hoursBetweenTimes(inTime, outTime) {
            const a = parseTimeToMinutes(inTime), b = parseTimeToMinutes(outTime);
            if (a === null || b === null) return 0;
            let diff = b - a;
            if (diff < 0) diff += 24 * 60;
            return Number((diff / 60).toFixed(2));
        }

        function getMonthDays(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function exportExcelStats() {
            if (typeof XLSX === 'undefined') {
                toast('Excel 元件尚未載入，請確認網路連線後再試。', 'error');
                return;
            }

            const monthInput = document.getElementById('exportStatsMonth');
            const value = monthInput?.value || new Date().toISOString().slice(0, 7);
            const [year, month] = value.split('-').map(Number);
            if (!year || !month) {
                toast('請先選擇要匯出的月份。', 'warning');
                return;
            }

            const days = getMonthDays(year, month);
            const monthPrefix = `${year}-${String(month).padStart(2, '0')}-`;
            const records = state.attendanceRecords.filter(r => String(r.date || '').startsWith(monthPrefix));

            const summary = [];
            const daily = [];
            const scheduleRows = [];

            state.employees.forEach(emp => {
                ensureMonthlySchedule(emp);
                let scheduledTotal = 0;
                let actualTotal = 0;
                let overtimeTotal = 0;
                let workdays = 0;
                let lateDays = 0;
                let leaveDays = 0;
                const row = {
                    '員工編號': emp.code || '',
                    '員工姓名': emp.name || '',
                    '部門': emp.dept || '',
                    '職稱': emp.job || '',
                    '排定工時': 0,
                    '實際工時': 0,
                    '加班時數': 0,
                    '出勤天數': 0,
                    '遲到天數': 0,
                    '請假天數': 0
                };

                for (let d = 1; d <= days; d++) {
                    const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const dateObj = new Date(year, month - 1, d);
                    const schedule = getEmployeeSchedule(emp, dateObj);
                    const scheduledHours = hoursBetweenTimes(schedule.workStart, schedule.workEnd);
                    const saved = emp.monthlySchedule?.[dateKey] || {};
                    const shiftCode = saved.shiftCode || '';
                    const rec = records.find(r => r.employeeId === emp.id && r.date === dateKey);
                    const actualHours = rec ? hoursBetweenTimes(rec.inTime, rec.outTime) : 0;
                    const overtime = rec && actualHours > 0
                        ? Number(Math.max(0, Math.min(actualHours - scheduledHours, Number(schedule.overtimeHours) || 0)).toFixed(2))
                        : 0;

                    if (rec && rec.status === '請假') leaveDays++;
                    if (rec && rec.inTime && rec.inTime !== '--' && rec.outTime && rec.outTime !== '--') workdays++;
                    if (rec && rec.status === '遲到') lateDays++;
                    if (rec && actualHours > 0) {
                        actualTotal += actualHours;
                        overtimeTotal += overtime;
                    }
                    if (shiftCode || (rec && actualHours > 0)) scheduledTotal += scheduledHours;

                    row[`${d}日班別`] = shiftCode;
                    row[`${d}日上班`] = rec?.inTime || '';
                    row[`${d}日下班`] = rec?.outTime || '';
                    row[`${d}日工時`] = actualHours || '';
                    row[`${d}日加班`] = overtime || '';

                    daily.push({
                        '日期': dateKey,
                        '員工編號': emp.code || '',
                        '員工姓名': emp.name || '',
                        '部門': emp.dept || '',
                        '職稱': emp.job || '',
                        '班別代碼': shiftCode,
                        '班表上班': schedule.workStart,
                        '班表下班': schedule.workEnd,
                        '上班打卡': rec?.inTime || '',
                        '下班打卡': rec?.outTime || '',
                        '實際工時': actualHours || 0,
                        '加班時數': overtime || 0,
                        '狀態': rec?.status || '未打卡'
                    });
                }

                row['排定工時'] = Number(scheduledTotal.toFixed(2));
                row['實際工時'] = Number(actualTotal.toFixed(2));
                row['加班時數'] = Number(overtimeTotal.toFixed(2));
                row['出勤天數'] = workdays;
                row['遲到天數'] = lateDays;
                row['請假天數'] = leaveDays;
                summary.push(row);

                const scheduleRow = {
                    '車別/部門': emp.dept || '',
                    '職稱': emp.job || '',
                    '姓名': emp.name || ''
                };
                for (let d = 1; d <= days; d++) {
                    const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const saved = emp.monthlySchedule?.[dateKey] || {};
                    scheduleRow[String(d)] = saved.shiftCode || '';
                }
                scheduleRows.push(scheduleRow);
            });

            const wb = XLSX.utils.book_new();
            const wsSummary = XLSX.utils.json_to_sheet(summary);
            const wsDaily = XLSX.utils.json_to_sheet(daily);
            const wsSchedule = XLSX.utils.json_to_sheet(scheduleRows);

            wsSummary['!cols'] = [
                { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 18 },
                { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 10 }
            ];
            wsDaily['!cols'] = [
                { wch: 12 }, { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 18 },
                { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 12 },
                { wch: 10 }, { wch: 10 }, { wch: 10 }
            ];

            XLSX.utils.book_append_sheet(wb, wsSummary, '月統計');
            XLSX.utils.book_append_sheet(wb, wsSchedule, '每日班別');
            XLSX.utils.book_append_sheet(wb, wsDaily, '每日明細');

            const filename = `K專案_${year}年${String(month).padStart(2, '0')}月_出勤統計表.xlsx`;
            XLSX.writeFile(wb, filename);
            toast(`已匯出 ${year}年${month}月 Excel 統計表！`, 'success');
        }

        function exportExcelAll() {
            const data = state.attendanceRecords.map(r => ({
                "出勤日期": r.date,
                "員工姓名": r.employeeName,
                "所屬部門": r.dept,
                "上班打卡時間": r.inTime,
                "下班打卡時間": r.outTime,
                "出勤判定": r.status,
                "打卡地點/GPS": r.location
            }));

            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "差勤歷史報表");
            XLSX.writeFile(wb, "全公司差勤明細表_2026.xlsx");
            toast("Excel (.xlsx) 檔案下載完成！", "success");
        }

        function renderManagerRequests(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700">
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">員工單據簽核審核</h2>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">審核同仁補打卡與請假申請單</p>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">
                        <div class="divide-y divide-slate-100 dark:divide-slate-700">
                            ${state.requests.length === 0 ? `
                                <div class="p-8 text-center text-slate-400">目前尚無待處理的簽核單</div>
                            ` : state.requests.map(r => `
                                <div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-2">
                                            <span class="font-bold text-slate-900 dark:text-white text-base">${r.name}</span>
                                            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${r.type === '補打卡' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'}">${r.type}</span>
                                            <span class="text-xs text-slate-400 font-mono">${r.date}</span>
                                        </div>
                                        <p class="text-xs text-slate-600 dark:text-slate-300">申請原因：${r.reason}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ${r.status === '待審核' ? `
                                            <button onclick="approveRequest('${r.id}', '已核准')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-md">
                                                核准
                                            </button>
                                            <button onclick="approveRequest('${r.id}', '已駁回')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-md">
                                                駁回
                                            </button>
                                        ` : `
                                            <span class="px-3 py-1 rounded-full text-xs font-bold ${r.status === '已核准' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                                ${r.status}
                                            </span>
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function approveRequest(reqId, newStatus) {
            const req = state.requests.find(x => x.id === reqId);
            if (req) {
                req.status = newStatus;
                saveState();
                renderApp();
                toast(`已將 ${req.name} 的申請單設定為：${newStatus}`, newStatus === '已核准' ? 'success' : 'warning');
            }
        }

        function openManagerPasswordModal() {
            showModal(
                "修改主管登入密碼",
                `
                <form id="managerPasswordForm" class="space-y-4" onsubmit="event.preventDefault(); saveManagerPassword();">
                    <div class="p-3 rounded-xl bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 text-xs">
                        <i data-lucide="shield-check" class="w-4 h-4 inline mr-1"></i>
                        修改後請使用新密碼重新登入主管帳號。
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">目前密碼</label>
                        <input id="managerOldPassword" type="password" autocomplete="current-password" required class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900" placeholder="請輸入目前主管密碼">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">新密碼</label>
                        <input id="managerNewPassword" type="password" autocomplete="new-password" required minlength="4" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900" placeholder="至少 4 個字元">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">確認新密碼</label>
                        <input id="managerConfirmPassword" type="password" autocomplete="new-password" required minlength="4" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-900" placeholder="再次輸入新密碼">
                    </div>
                </form>
                `,
                [
                    { text: "取消", class: "bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200", onclick: "closeModal()" },
                    { text: "儲存新密碼", class: "bg-blue-600 text-white", onclick: "saveManagerPassword()" }
                ]
            );
        }

        function saveManagerPassword() {
            const oldPassword = document.getElementById("managerOldPassword")?.value || "";
            const newPassword = document.getElementById("managerNewPassword")?.value || "";
            const confirmPassword = document.getElementById("managerConfirmPassword")?.value || "";

            if (oldPassword !== MANAGER_ACCOUNT.password) {
                toast("目前密碼輸入錯誤", "error");
                return;
            }
            if (newPassword.length < 4) {
                toast("新密碼至少需要 4 個字元", "warning");
                return;
            }
            if (newPassword !== confirmPassword) {
                toast("兩次輸入的新密碼不一致", "warning");
                return;
            }
            if (newPassword === oldPassword) {
                toast("新密碼不能與目前密碼相同", "warning");
                return;
            }

            MANAGER_ACCOUNT.password = newPassword;
            saveManagerAccount();
            closeModal();
            toast("主管登入密碼已成功修改", "success");
        }

        function showModal(title, bodyHTML, buttons = []) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;

            const footer = document.getElementById('modalFooter');
            footer.innerHTML = buttons.map(b => `
                <button onclick="${b.onclick}" class="px-4 py-2 rounded-xl text-xs font-bold transition ${b.class}">
                    ${b.text}
                </button>
            `).join('');

            const backdrop = document.getElementById('modalBackdrop');
            const modal = document.getElementById('modalContainer');

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                modal.classList.remove('scale-95');
                modal.classList.add('scale-100');
            }, 10);
            lucide.createIcons();
        }

        function closeModal() {
            const backdrop = document.getElementById('modalBackdrop');
            const modal = document.getElementById('modalContainer');

            backdrop.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-95');

            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 200);
        }
    </script>
</body>
